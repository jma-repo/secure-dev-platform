name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# No deployment, no registry push, no cloud credentials, no npm install.
# Downloaders come from scripts/bootstrap-tools.py and are SHA256-verified:
# gitleaks 8.30.1 / terraform 1.16.6 / trivy 0.76.1.
#
# Gate policy (this is why a red build means something):
#   - Secrets: any finding blocks. There is never a reason to accept one.
#   - Misconfiguration we own (Dockerfile, Terraform): HIGH and CRITICAL block.
#   - Third-party CVEs in a base image: only CRITICAL *with a published fix*
#     blocks. An unfixed CVE cannot be acted on locally, and blocking on it
#     teaches the team to ignore red builds. Everything found is still
#     reported and uploaded as an artifact.
jobs:
  test:
    name: Security unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pin Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.2"
          package-manager-cache: false
      - name: Install real scanner for integration tests
        run: python3 scripts/bootstrap-tools.py gitleaks
      - name: Run security unit tests
        run: |
          mkdir -p reports
          test "$(node --version)" = "v22.22.2"
          node --test --test-reporter=tap 2>&1 | tee reports/test.tap
          # Guard against a zero-test run being reported as a pass.
          grep -Eq '^# tests [1-9][0-9]*$' reports/test.tap
      - name: Publish test summary
        if: ${{ always() }}
        run: |
          {
            echo "## Security unit tests"
            echo ""
            if [ -f reports/test.tap ]; then
              grep -E '^# (tests|pass|fail) ' reports/test.tap | sed 's/^# /- /' || true
            else
              echo "No TAP report was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Always keep the test report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-reports
          path: reports/test.tap
          retention-days: 3
          if-no-files-found: warn

  secrets:
    name: Secrets full history
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out all branches and tags with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install and verify Gitleaks
        run: |
          mkdir -p reports
          python3 scripts/bootstrap-tools.py gitleaks 2>&1 | tee reports/gitleaks-bootstrap.log
      - name: Scan full Git history and redact the report
        run: .tools/gitleaks git --log-opts="--all" --redact --exit-code=1 --report-format=json --report-path=reports/gitleaks.json .
      - name: Publish secret scan summary
        if: ${{ always() }}
        run: |
          {
            echo "## Secret scan (full history)"
            echo ""
            if [ -f reports/gitleaks.json ]; then
              count=$(jq 'length' reports/gitleaks.json 2>/dev/null || echo 0)
              echo "- Findings: **$count**"
              echo "- Policy: any finding blocks the merge"
            else
              echo "No report was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Always keep the redacted secret report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secret-scan-reports
          path: |
            reports/gitleaks.json
            reports/gitleaks-bootstrap.log
          retention-days: 3
          if-no-files-found: warn

  iac:
    name: Local contract and config
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install and verify Terraform and Trivy
        run: |
          mkdir -p reports
          python3 scripts/bootstrap-tools.py terraform trivy 2>&1 | tee reports/iac-bootstrap.log
          printf '%s\n' \
            'Terraform holds a local terraform_data contract only. No cloud resources exist.' \
            'If Trivy has no rule for terraform_data, a zero finding count is not IaC coverage of any cloud resource.' \
            'Dockerfile scanning targets the root runtime image only; the dev container installs apt packages as root and is out of scope. No rules are suppressed.' \
            > reports/config-scope.txt
      - name: Check Terraform formatting
        run: .tools/terraform fmt -check -diff -recursive infra/terraform 2>&1 | tee reports/terraform-fmt.txt
      - name: Initialize the local contract without a backend
        run: .tools/terraform -chdir=infra/terraform init -backend=false -input=false -no-color 2>&1 | tee reports/terraform-init.txt
      - name: Validate the local contract
        run: .tools/terraform -chdir=infra/terraform validate -json > reports/terraform-validate.json
      - name: Scan Terraform configuration
        if: ${{ !cancelled() }}
        run: .tools/trivy config --severity HIGH,CRITICAL --exit-code 1 --format json --output reports/trivy-terraform.json infra/terraform
      - name: Scan the runtime Dockerfile only
        if: ${{ !cancelled() }}
        run: .tools/trivy config --severity HIGH,CRITICAL --exit-code 1 --format json --output reports/trivy-dockerfile.json Dockerfile
      - name: Publish configuration summary
        if: ${{ always() }}
        run: |
          {
            echo "## Configuration checks"
            echo ""
            echo "| Report | Misconfigurations |"
            echo "| --- | --- |"
            for f in trivy-terraform.json trivy-dockerfile.json; do
              if [ -f "reports/$f" ]; then
                n=$(jq '[.Results[]?.Misconfigurations[]?] | length' "reports/$f" 2>/dev/null || echo "n/a")
                echo "| $f | $n |"
              else
                echo "| $f | not produced |"
              fi
            done
            echo ""
            echo "Misconfiguration we own blocks on HIGH or CRITICAL."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Always keep the contract and config reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-config-reports
          path: |
            reports/iac-bootstrap.log
            reports/config-scope.txt
            reports/terraform-*.txt
            reports/terraform-validate.json
            reports/trivy-terraform.json
            reports/trivy-dockerfile.json
          retention-days: 3
          if-no-files-found: warn

  deps:
    name: Dependency vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install and verify Trivy
        run: |
          mkdir -p reports
          python3 scripts/bootstrap-tools.py trivy 2>&1 | tee reports/deps-bootstrap.log
      - name: Scan dependencies
        # Zero third-party npm packages does not mean every system library is
        # covered; the runtime image is scanned separately in the image job.
        run: |
          .tools/trivy fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --format json --output reports/dependencies.json .
          .tools/trivy fs --scanners vuln --severity CRITICAL --ignore-unfixed \
            --exit-code 1 --format table . | tee reports/dependencies-gate.txt
      - name: Publish dependency summary
        if: ${{ always() }}
        run: |
          {
            echo "## Dependency vulnerabilities"
            echo ""
            if [ -f reports/dependencies.json ]; then
              echo "| Severity | Fixable | Total |"
              echo "| --- | --- | --- |"
              for s in CRITICAL HIGH MEDIUM LOW; do
                total=$(jq --arg s "$s" '[.Results[]?.Vulnerabilities[]? | select(.Severity==$s)] | length' reports/dependencies.json 2>/dev/null || echo 0)
                fixable=$(jq --arg s "$s" '[.Results[]?.Vulnerabilities[]? | select(.Severity==$s and .FixedVersion != "")] | length' reports/dependencies.json 2>/dev/null || echo 0)
                echo "| $s | $fixable | $total |"
              done
            else
              echo "No report was produced."
            fi
            echo ""
            echo "Blocks on fixable CRITICAL only."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Always keep the dependency report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-scan-reports
          path: |
            reports/dependencies.json
            reports/dependencies-gate.txt
            reports/deps-bootstrap.log
          retention-days: 3
          if-no-files-found: warn

  image:
    name: Container vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install and verify Trivy
        run: |
          mkdir -p reports
          python3 scripts/bootstrap-tools.py trivy 2>&1 | tee reports/image-bootstrap.log
      - name: Build the runtime image locally without pushing
        run: docker build --tag secure-dev-poc:ci . 2>&1 | tee reports/image-build.log
      - name: Record every finding in the image
        # Reporting step: no --exit-code, so a finding never fails the build here.
        run: |
          .tools/trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --format json --output reports/image.json secure-dev-poc:ci
      - name: Gate on fixable critical vulnerabilities
        # Only CVEs with a published fix block. A base-image CVE with no
        # upstream patch is a vendor problem, not a merge blocker.
        run: |
          .tools/trivy image --scanners vuln --severity CRITICAL --ignore-unfixed \
            --exit-code 1 --format table secure-dev-poc:ci | tee reports/image-gate.txt
      - name: Publish image summary
        if: ${{ always() }}
        run: |
          {
            echo "## Container image"
            echo ""
            echo "Base image: \`$(grep -m1 '^FROM' Dockerfile | awk '{print $2}' || echo unknown)\`"
            echo ""
            if [ -f reports/image.json ]; then
              echo "| Severity | Fixable | Total |"
              echo "| --- | --- | --- |"
              for s in CRITICAL HIGH MEDIUM LOW; do
                total=$(jq --arg s "$s" '[.Results[]?.Vulnerabilities[]? | select(.Severity==$s)] | length' reports/image.json 2>/dev/null || echo 0)
                fixable=$(jq --arg s "$s" '[.Results[]?.Vulnerabilities[]? | select(.Severity==$s and .FixedVersion != "")] | length' reports/image.json 2>/dev/null || echo 0)
                echo "| $s | $fixable | $total |"
              done
            else
              echo "No report was produced."
            fi
            echo ""
            echo "Blocks on fixable CRITICAL only. Unfixed base-image CVEs are reported, not hidden."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Always keep the image scan report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-scan-reports
          path: |
            reports/image.json
            reports/image-gate.txt
            reports/image-build.log
            reports/image-bootstrap.log
          retention-days: 3
          if-no-files-found: warn
