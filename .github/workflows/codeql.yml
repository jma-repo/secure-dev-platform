name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  analyze:
    name: CodeQL JavaScript TypeScript
    # Runs automatically on public repositories. For private repositories, confirm Code Security or the matching license first, then set the variable manually.
    # ENABLE_PRIVATE_CODEQL only controls this job. It does not buy a license or turn on repository security products automatically.
    if: ${{ github.event.repository.private == false || vars.ENABLE_PRIVATE_CODEQL == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read # Needed so that analysis of private repositories can read workflow information.
      security-events: write # Only uploads CodeQL results; does not push source code or change repository settings.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pin project Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.2"
          package-manager-cache: false
      - name: Create report directory
        run: |
          mkdir -p reports/codeql
          test "$(node --version)" = "v22.22.2"
      - name: Initialize build-less analysis
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze and upload code scanning results
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:javascript-typescript
          output: reports/codeql
          upload: true
      - name: Always keep SARIF report for a short time
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif-reports
          path: reports/codeql/*.sarif
          retention-days: 3
          if-no-files-found: warn

# This job is skipped on private repositories without authorization, so it is not listed as a general required branch-protection check.
# After the license and repository settings are confirmed, the actual check name can be added to branch protection manually.
